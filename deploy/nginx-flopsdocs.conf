# flops-agent.xenotech.studio / flopsruntime.xenotech.studio — static React/Vite site
# Included from /home/ubuntu/nginx.conf; SSL uses the *.xenotech.studio wildcard certificate.
#
# This config lives with the site it serves (Xenotech-Studio/flops-agent-docs).
# The English docs are authored in Xenotech-Studio/flops-agent and mirrored into
# docs/en/ by .github/workflows/sync-docs.yml.

server {
    listen 80;
    server_name flops-agent.xenotech.studio flopsruntime.xenotech.studio;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flops-agent.xenotech.studio flopsruntime.xenotech.studio;
    root /home/ubuntu/flowseries/flops-agent-docs/website/dist;
    index index.html;

    ssl_certificate /home/ubuntu/__ssl__/xenotech.studio/xenotech.studio_bundle.pem;
    ssl_certificate_key /home/ubuntu/__ssl__/xenotech.studio/xenotech.studio.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Prerendered document pages live in real directories (/docs/<slug>/index.html).
    # try_files also serves the slashless form, so every pre-existing link keeps
    # working without an extra redirect hop.
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
